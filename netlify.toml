# Nomad AI — Netlify site settings.
#
# The app is static: no build step, the folder is the site. The only moving
# parts are the two functions, which hold the API keys so the browser does
# not have to.
#
# Set these on the site before deploying —
#   Site configuration → Environment variables, or:
#     netlify env:import .env
#
#   GEMINI_API_KEY   the assistant
#   TWOGIS_API_KEY   public transport stops and routes
#
# Without them the app still runs; the assistant falls back to asking each
# visitor for their own key, and the transport section does not appear.

[build]
  # The folder IS the site, so everything in it is published.
  #
  # ⚠ `netlify deploy` uploads the WORKING DIRECTORY, not the repo, and it
  #   does not read .gitignore. A gitignored file sitting here — .env,
  #   a keys note, a nomad-config.js with real keys pasted back in for a
  #   local run — is published with everything else. That has happened.
  #   Netlify skips dotfiles, so .env survived it; a plainly-named file
  #   will not.
  #
  #   Deploy by pushing to GitHub, which builds from the committed tree and
  #   cannot carry an untracked file. Keep local-only secrets outside this
  #   folder, and use `netlify dev` for a local run — it reads .env and
  #   serves the functions, so nomad-config.js can stay empty.
  publish = "."
  # No command: nothing to compile.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The functions declare their own routes (/api/ai, /api/transit) with the
# `config.path` export, so no redirects are needed here.

# The service worker must never be served from cache, or an installed app
# can be pinned to an old build forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The shell is the one file with no ?v= of its own — every other URL is
# versioned by it. A cached index.html therefore keeps requesting the
# previous build's assets, and the app silently runs the old code. This was
# hit during development: edits showed up only on a URL with a query string,
# because that was the only thing missing from the cache.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-lived assets. Every URL the app requests carries ?v=, so a new build
# is a new URL and this cannot serve a stale one.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
